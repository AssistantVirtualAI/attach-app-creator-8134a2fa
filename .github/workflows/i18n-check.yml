name: i18n check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  i18n-duplicates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check i18n duplicate keys
        run: npm run check:i18n
      - name: Check i18n locale parity (FR/EN)
        run: npx vitest run src/test/i18n-integrity.test.ts --reporter=verbose
      - name: Upload i18n report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-report
          path: i18n-report/
          if-no-files-found: warn

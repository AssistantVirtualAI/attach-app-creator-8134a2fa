name: i18n check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  i18n-duplicates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check i18n duplicate keys
        run: npm run check:i18n

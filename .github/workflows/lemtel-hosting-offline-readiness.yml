name: Lemtel hosting — offline readiness

on:
  pull_request:
    paths:
      - '.github/workflows/lemtel-hosting-offline-readiness.yml'
      - 'scripts/lemtel-hosting-preflight*'
      - 'scripts/inventory-lemtel-hosting*'
      - 'scripts/lemtel-dependency-closure*'
      - 'schemas/lemtel-staging-admission/staging-admission-policy.json'
      - 'docs/lemtel-mobile/phase-31b-hosting-admission-inventory.md'
      - 'docs/lemtel-mobile/phase-31c-backend-dependency-boundary.md'
      - 'apps/ava-softphone-mobile/src/**'
      - 'apps/ava-softphone-desktop/src/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
  push:
    paths:
      - '.github/workflows/lemtel-hosting-offline-readiness.yml'
      - 'scripts/lemtel-hosting-preflight*'
      - 'scripts/inventory-lemtel-hosting*'
      - 'scripts/lemtel-dependency-closure*'
      - 'schemas/lemtel-staging-admission/staging-admission-policy.json'
      - 'docs/lemtel-mobile/phase-31b-hosting-admission-inventory.md'
      - 'docs/lemtel-mobile/phase-31c-backend-dependency-boundary.md'
      - 'apps/ava-softphone-mobile/src/**'
      - 'apps/ava-softphone-desktop/src/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'

permissions:
  contents: read

jobs:
  offline-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fail-closed hosting gate and read-only dependency inventory
        run: node --test scripts/lemtel-hosting-preflight.test.mjs scripts/inventory-lemtel-hosting.test.mjs scripts/lemtel-dependency-closure.test.mjs
      - name: Both destinations must remain blocked by the current policy
        shell: bash
        run: |
          for target in hostinger-primary digitalocean-standby; do
            for mode in --verify --report; do
              set +e
              output="$(node scripts/lemtel-hosting-preflight.mjs "$mode" --target="$target")"
              result=$?
              set -e
              test "$result" -eq 78
              if test "$mode" = '--verify'; then
                test "$output" = 'HOSTING_BLOCKED: ADMISSION_DENIED'
              else
                printf '%s' "$output" | node -e 'let s=""; process.stdin.on("data", d => s+=d); process.stdin.on("end", () => { const x=JSON.parse(s); if (x.status !== "blocked") process.exit(1) })'
              fi
            done
          done
      - name: Inventory is discovery only, not a migration or deployment
        run: |
          node scripts/inventory-lemtel-hosting.mjs | node -e 'let s=""; process.stdin.on("data", d => s+=d); process.stdin.on("end", () => { const x=JSON.parse(s); if (x.database_export_authorized || x.migration_replay_authorized || x.functions_deploy_authorized || x.status !== "discovery_only_manual_review_required") process.exit(1) })'
      - name: Transitive and client dependencies remain manual-review findings
        run: |
          node scripts/lemtel-dependency-closure.mjs | node -e 'let s=""; process.stdin.on("data", d => s+=d); process.stdin.on("end", () => { const x=JSON.parse(s); if (!x.source_analysis_only || !x.findings_are_not_allowlist || x.database_export_authorized || x.migration_replay_authorized || x.functions_deploy_authorized || x.status !== "incomplete_manual_review_required") process.exit(1) })'

name: Lemtel iOS — TestFlight internal beta

on:
  workflow_dispatch:
    inputs:
      confirm_testflight_upload:
        description: "Must be true to upload a signed internal beta to TestFlight."
        required: true
        default: false
        type: boolean
      release_notes:
        description: "Short bilingual “What to Test” note for internal testers."
        required: true
        default: "Lemtel beta: email-only access, French/English, Dark/Daylight visual refresh."
        type: string
  push:
    tags:
      - "lemtel-ios-testflight-v*"

permissions:
  contents: read

concurrency:
  group: lemtel-ios-testflight
  cancel-in-progress: false

jobs:
  internal-testflight:
    if: github.event_name == 'push' || inputs.confirm_testflight_upload == true
    name: Signed iOS beta → TestFlight internal
    runs-on: macos-14
    timeout-minutes: 60
    environment: lemtel-ios-testflight
    defaults:
      run:
        working-directory: apps/ava-softphone-mobile
    env:
      VITE_LEMTEL_TARGET: ${{ vars.VITE_LEMTEL_TARGET }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_LEMTEL_PRIVATE_DIRECTORY: ${{ vars.VITE_LEMTEL_PRIVATE_DIRECTORY }}
      VITE_LEMTEL_EMAIL_ONLY_SIGNIN: approved
      VITE_LEMTEL_AUTH_REDIRECT_URL: ${{ vars.VITE_LEMTEL_AUTH_REDIRECT_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ava-softphone-mobile/package-lock.json

      - name: Validate Lemtel-only iOS release boundary
        run: |
          node scripts/ios-native-readiness.test.mjs
          node ../../scripts/lemtel-hostinger-client-config-filter.mjs

      - name: Install locked mobile dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build Lemtel Hostinger web bundle and sync iOS
        run: |
          npm run build
          npx cap sync ios

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store provisioning profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: com.lemtel.softphone
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Archive signed Lemtel iOS beta
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Lemtel.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive

      - name: Export TestFlight IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Lemtel.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/lemtel-export"
          test -s "$RUNNER_TEMP/lemtel-export/App.ipa"

      - name: Upload the signed internal beta to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/lemtel-export/App.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          release-notes: "${{ github.event_name == 'push' && 'Lemtel 1.1 (2): test email-only access, French/English, and Dark/Daylight mobile refresh.' || inputs.release_notes }}"
          uses-non-exempt-encryption: "false"
          wait-for-processing: "true"

      - name: Save signed IPA for the internal test record
        uses: actions/upload-artifact@v4
        with:
          name: lemtel-ios-testflight-${{ github.run_id }}
          path: ${{ runner.temp }}/lemtel-export/App.ipa
          if-no-files-found: error
          retention-days: 14

name: Lemtel mobile — private directory adapters

on:
  pull_request:
    paths:
      - '.github/workflows/lemtel-mobile-private-directory-adapters.yml'
      - 'apps/ava-softphone-mobile/src/lib/lemtelPrivateDirectory*'
      - 'apps/ava-softphone-mobile/src/lib/sip/callerLookup*'
      - 'apps/ava-softphone-mobile/src/components/WssDiagnostics*'
      - 'docs/lemtel-mobile/phase-41a-mobile-private-directory-adapters.md'
  push:
    branches:
      - lemtel/integration
    paths:
      - '.github/workflows/lemtel-mobile-private-directory-adapters.yml'
      - 'apps/ava-softphone-mobile/src/lib/lemtelPrivateDirectory*'
      - 'apps/ava-softphone-mobile/src/lib/sip/callerLookup*'
      - 'apps/ava-softphone-mobile/src/components/WssDiagnostics*'
      - 'docs/lemtel-mobile/phase-41a-mobile-private-directory-adapters.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lemtel-mobile-private-directory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-inert-private-directory-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/ava-softphone-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/ava-softphone-mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Test legacy isolation, caller lookup and minimized WSS telemetry
        run: >-
          npx vitest run
          src/lib/lemtelPrivateDirectory.test.ts
          src/lib/sip/callerLookup.privateDirectory.test.ts
          src/components/WssDiagnostics.backendBoundary.test.tsx
          src/lib/contacts.backendBoundary.test.ts
      - name: Typecheck without building or signing a client
        run: npx tsc --noEmit

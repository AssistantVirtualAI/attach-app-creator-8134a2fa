name: Lemtel mobile — session, recording and TURN authority

on:
  pull_request:
    paths:
      - 'apps/ava-softphone-mobile/**'
      - 'supabase/functions/ai-transcribe-call/**'
      - 'supabase/functions/ai-analyze-call/**'
      - 'supabase/functions/mobile-calls/**'
      - 'supabase/functions/mobile-voicemails/**'
      - 'supabase/functions/fusionpbx-proxy/**'
      - 'supabase/functions/get-turn-credentials/**'
      - '.github/workflows/lemtel-mobile-recording-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile session/audio tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ava-softphone-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/ava-softphone-mobile/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check renderer types
        run: npx tsc --noEmit -p tsconfig.json
      - name: Test full Lemtel mobile suite (including cutover and TURN)
        run: npm test -- --reporter=dot
      - name: Build mobile web bundle (no native submission)
        run: npm run build

  contract:
    name: Recording and TURN authority Deno contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - name: Type-check transcription function
        run: deno check --no-lock supabase/functions/ai-transcribe-call/index.ts
      - name: Type-check PBX analysis branch
        run: deno check --no-lock --node-modules-dir=auto supabase/functions/ai-analyze-call/index.ts
      - name: Type-check mobile history and voicemail endpoints
        run: deno check --no-lock supabase/functions/mobile-calls/index.ts supabase/functions/mobile-voicemails/index.ts
      - name: Type-check Lemtel TURN issuer
        run: deno check --no-lock supabase/functions/get-turn-credentials/index.ts
      - name: Verify server contract without backend access
        run: >-
          deno test --no-check --allow-read --no-lock
          supabase/functions/ai-transcribe-call/recordingAuthority.contract.test.ts
          supabase/functions/fusionpbx-proxy/recordingAccess.contract.test.ts
          supabase/functions/get-turn-credentials/turnIssuer.contract.test.ts

name: Lemtel — private Operations portal build

on:
  push:
    branches: [lemtel/integration]
    paths:
      - 'src/lemtel-portal-main.tsx'
      - 'src/lemtel-portal-build.css'
      - 'src/pages/lemtel/onboarding/**'
      - 'lemtel-portal.html'
      - 'vite.config.lemtel-portal.ts'
      - 'scripts/lemtel-operations-portal-build.test.mjs'
      - '.github/workflows/lemtel-operations-portal-build.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for this non-public Lemtel Operations portal build"
        required: true
        default: "Operational status portal deployment package"
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: lemtel-operations-portal-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-private-portal:
    environment: lemtel-hostinger-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_LEMTEL_TARGET: ${{ vars.VITE_LEMTEL_TARGET }}
      VITE_LEMTEL_API_URL: ${{ vars.VITE_LEMTEL_API_URL }}
      VITE_LEMTEL_PRIVATE_DIRECTORY: ${{ vars.VITE_LEMTEL_PRIVATE_DIRECTORY }}
      VITE_LEMTEL_EMAIL_ONLY_SIGNIN: approved
      VITE_LEMTEL_AUTH_REDIRECT_URL: ${{ vars.VITE_LEMTEL_AUTH_REDIRECT_URL }}
      VITE_LEMTEL_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_LEMTEL_HOSTED_ONBOARDING: approved
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enforce the canonical Lemtel runtime configuration
        run: node scripts/lemtel-hostinger-client-config-filter.mjs
      - name: Validate Operations portal boundaries
        run: |
          npx vitest run src/pages/lemtel/onboarding/__tests__/lemtelPortalContract.test.ts
          node --test scripts/lemtel-operations-portal-build.test.mjs
      - name: Build the isolated Operations portal
        run: npx vite build --config vite.config.lemtel-portal.ts
      - name: Verify deployable subpath output
        run: |
          set -euo pipefail
          test -s dist-lemtel-portal/lemtel-portal.html
          grep -q '/lemtel-portal/assets/' dist-lemtel-portal/lemtel-portal.html
          if grep -R -E 'gejxisrqtvxavbrfcoxz|planipret' dist-lemtel-portal; then
            echo 'Legacy cross-product content detected in the Lemtel portal artifact.' >&2
            exit 1
          fi
      - name: Upload immutable Operations portal artifact
        id: portal_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lemtel-operations-portal-${{ github.run_id }}
          path: dist-lemtel-portal
          if-no-files-found: error
          retention-days: 3
      - name: Attest immutable Operations portal artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: lemtel-operations-portal-${{ github.run_id }}
          subject-digest: sha256:${{ steps.portal_artifact.outputs.artifact-digest }}

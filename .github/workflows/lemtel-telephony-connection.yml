name: lemtel-telephony-connection

on:
  pull_request:
    paths:
      - 'infra/lemtel-self-hosted/functions/_shared/lemtelPbxConnection*'
      - 'infra/lemtel-self-hosted/functions/lemtel-pbx-connection-admin/**'
      - 'infra/lemtel-self-hosted/functions/lemtel-softphone-provisioning/**'
      - 'infra/lemtel-self-hosted/functions/lemtel-failover-status/**'
      - 'infra/lemtel-self-hosted/migrations/0024_lemtel_pbx_connection.sql'
      - 'apps/ava-softphone-desktop/src/lib/lemtelSoftphoneProvisioning*'
      - 'apps/ava-softphone-mobile/src/lib/lemtelSoftphoneProvisioning*'
      - 'src/pages/lemtel/onboarding/**'
      - 'scripts/lemtel-softphone-provisioning-contract.test.mjs'
      - 'scripts/lemtel-telephony-connection-deploy.test.mjs'
      - 'infra/lemtel-resilience/active-passive/lemtel-ha-do-writer-telephony-connection-deploy.sh'
      - '.github/workflows/lemtel-telephony-connection.yml'
  push:
    branches: [lemtel/integration]
    paths:
      - 'infra/lemtel-self-hosted/functions/**'
      - 'apps/ava-softphone-*/src/lib/lemtelSoftphoneProvisioning*'
      - 'src/pages/lemtel/onboarding/**'

permissions:
  contents: read

jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - name: Mobile and Desktop share one provisioning contract
        run: node --test scripts/lemtel-softphone-provisioning-contract.test.mjs scripts/lemtel-telephony-connection-deploy.test.mjs
      - name: Edge Functions (offline, fake PBX over WSS, in-memory database)
        run: |
          deno check --node-modules-dir=auto infra/lemtel-self-hosted/functions/lemtel-pbx-connection-admin/index.ts infra/lemtel-self-hosted/functions/lemtel-softphone-provisioning/index.ts infra/lemtel-self-hosted/functions/lemtel-failover-status/index.ts
          deno test --no-prompt --node-modules-dir=auto infra/lemtel-self-hosted/functions/_shared/lemtelPbxConnection.test.ts infra/lemtel-self-hosted/functions/lemtel-pbx-connection-admin/index.test.ts infra/lemtel-self-hosted/functions/lemtel-failover-status/index.test.ts
      - name: Migration applies twice on PostgreSQL 16, keeps secrets encrypted and RLS closed
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role; CREATE SCHEMA auth; CREATE TABLE auth.users(id uuid primary key); CREATE TABLE public.lemtel_organizations(id uuid primary key, status text);"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -f infra/lemtel-self-hosted/migrations/0024_lemtel_pbx_connection.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -f infra/lemtel-self-hosted/migrations/0024_lemtel_pbx_connection.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "INSERT INTO lemtel_organizations VALUES ('11111111-1111-4111-8111-111111111111','active'); INSERT INTO lemtel_pbx_connections(organization_id,sip_domain,pbx_host,sip_transport,sip_port,wss_url,state,updated_by) VALUES ('11111111-1111-4111-8111-111111111111','lemtel.lemtel.tel','pbxnode.lemtel.tel','tls',5061,'wss://pbxnode.lemtel.tel:7443','active','22222222-2222-4222-8222-222222222222'); UPDATE lemtel_pbx_connections SET wss_url='wss://other.lemtel.tel:7443';"
          test "$(sudo -u postgres psql -At -c "SELECT state||':'||revision FROM lemtel_pbx_connections")" = "draft:2"
          ! sudo -u postgres psql -c "INSERT INTO lemtel_pbx_connection_secrets VALUES ('11111111-1111-4111-8111-111111111111','turn_shared_secret','plaintext',now(),'22222222-2222-4222-8222-222222222222')"
          ! sudo -u postgres psql -c "SET ROLE authenticated; SELECT * FROM lemtel_pbx_connections"

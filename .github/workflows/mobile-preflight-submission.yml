name: Mobile — Préflight soumission (iOS + Android)

# Bloque toute soumission App Store / Play si le préflight échoue.
on:
  push:
    branches: [main]
    paths:
      - "apps/planipret-mobile/**"
      - ".github/workflows/mobile-preflight-submission.yml"
  pull_request:
    paths:
      - "apps/planipret-mobile/**"
      - ".github/workflows/mobile-preflight-submission.yml"
  workflow_dispatch:
  release:
    types: [created]

concurrency:
  group: mobile-preflight-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/planipret-mobile

jobs:
  preflight:
    name: Préflight ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/planipret-mobile/package-lock.json

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: Vérifier la présence de @capgo/capacitor-updater
        run: node -e "require.resolve('@capgo/capacitor-updater/package.json'); console.log('@capgo/capacitor-updater OK')"

      - name: npm run preflight:${{ matrix.platform }}
        run: npm run preflight:${{ matrix.platform }}

      - name: Publier le rapport d'endpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endpoints-${{ matrix.platform }}
          path: apps/planipret-mobile/reports/endpoints.json
          if-no-files-found: ignore

  post-cap-sync-ios:
    name: Post cap sync iOS (signature stricte)
    runs-on: macos-14
    needs: preflight
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/planipret-mobile/package-lock.json
      - run: npm install --no-audit --no-fund
      - name: Générer le projet natif iOS
        run: npx cap add ios || true
      - name: Build + cap sync ios
        env:
          PP_SKIP_AUTOSYNC: "1"
        run: npm run build && npx cap sync ios && node scripts/apply-native-config.mjs
      - name: Contrôle strict entitlements / provisioning / signature
        env:
          PP_POST_CAP_SYNC: "1"
        run: node scripts/verify-signing.mjs --ios --post-sync

  post-cap-sync-android:
    name: Post cap sync Android (signature stricte)
    runs-on: ubuntu-latest
    needs: preflight
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/planipret-mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm install --no-audit --no-fund
      - name: Générer le projet natif Android
        run: npx cap add android || true
      - name: Build + cap sync android
        env:
          PP_SKIP_AUTOSYNC: "1"
        run: npm run build && npx cap sync android && node scripts/apply-native-config.mjs
      - name: Contrôle strict permissions + signature
        env:
          PP_POST_CAP_SYNC: "1"
        run: node scripts/verify-android.mjs && node scripts/verify-signing.mjs --android --post-sync

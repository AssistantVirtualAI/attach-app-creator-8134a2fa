name: Mobile Regression (Planiprêt)

# 1) Tests de non-régression (reconnexion chatbot/voicebot, garde-fou audio,
#    REGISTER SIP avec latence simulée, sync Contacts TTL/anti-concurrence)
# 2) npm run build && npx cap sync ios sur macOS
# 3) Validation rapide sur simulateur iOS (boot + build Xcode)

on:
  pull_request:
    paths:
      - 'apps/planipret-mobile/**'
      - '.github/workflows/mobile-regression.yml'
  push:
    branches: [main]
    paths:
      - 'apps/planipret-mobile/**'
  workflow_dispatch:

concurrency:
  group: mobile-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Tests de non-régression (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/planipret-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Reconnexion WebRTC/WebSocket + garde-fou audio
        run: npx vitest run src/lib/planipret/net src/lib/planipret/audio
      - name: REGISTER TLS avec latence simulée (407 à 13-20 s, sans PJSIP_EBUSY)
        run: npx vitest run src/lib/planipret/sip
      - name: Sync Contacts — TTL + anti-concurrence (anti log storm)
        run: npx vitest run src/lib/__tests__/ppContactsCache.test.ts
      - name: Suite complète (informatif — dette de tests héritée)
        continue-on-error: true
        run: npm test

  ios-sync:
    name: build + cap sync ios + smoke simulateur
    runs-on: macos-14
    needs: unit
    defaults:
      run:
        working-directory: apps/planipret-mobile
    env:
      PP_SKIP_AUTOSYNC: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund

      - name: Check imports
        run: npm run check:imports

      - name: npm run build
        run: npm run build

      - name: Vérifier Tailwind + build ID
        run: npm run precheck:build

      - name: npx cap sync ios
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
          node scripts/apply-native-config.mjs
          node scripts/verify-ios-scene.mjs

      - name: Vérifier l'injection des correctifs natifs (audio + SIP)
        run: |
          set -e
          grep -q "applyAudioRoute(retries" ios/App/App/Plugins/PpSipKeepAlive/PpSipKeepAlive.swift
          grep -q "setCommunicationDevice" scripts/apply-native-config.mjs
          echo "Correctifs natifs présents"

      - name: Démarrer un simulateur iPhone
        run: |
          UDID=$(xcrun simctl create pp-ci "iPhone 15" || xcrun simctl list devices available | grep -m1 -o "[0-9A-F-]\{36\}")
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true

      - name: Build de validation rapide (simulateur)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App -configuration Debug -sdk iphonesimulator \
            -destination "id=${SIM_UDID}" \
            -derivedDataPath build/ci CODE_SIGNING_ALLOWED=NO build | tail -40

      - name: Installer + lancer l'app sur le simulateur
        run: |
          APP=$(find build/ci/Build/Products -name "App.app" -maxdepth 3 | head -1)
          xcrun simctl install "$SIM_UDID" "$APP"
          xcrun simctl launch "$SIM_UDID" app.lovable.d91c259879a6408e9f0352317572ea4c
          sleep 15
          xcrun simctl spawn "$SIM_UDID" log show --last 30s --predicate 'processImagePath CONTAINS "App"' | tail -60

      - name: Nettoyage simulateur
        if: always()
        run: xcrun simctl delete "$SIM_UDID" || true

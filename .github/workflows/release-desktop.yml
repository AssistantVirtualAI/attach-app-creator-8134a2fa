name: Lemtel Desktop — validate and release

on:
  pull_request:
    paths:
      - "apps/ava-softphone-desktop/**"
      - "supabase/functions/fusionpbx-proxy/recordingAccess.contract.test.ts"
      - ".github/workflows/release-desktop.yml"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: Desktop tests, contract and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release tag points to a merged commit and the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin lemtel/integration
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo 'The Desktop release must be merged into lemtel/integration first'; exit 1;
          }
          VERSION="$(node -p 'require("./apps/ava-softphone-desktop/package.json").version')"
          test "$GITHUB_REF_NAME" = "v$VERSION" || {
            echo 'Tag and Desktop package.json version differ'; exit 1;
          }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ava-softphone-desktop/package-lock.json
      - name: Install locked dependencies
        working-directory: apps/ava-softphone-desktop
        run: npm ci --no-audit --no-fund
      - name: Verify release artifact validator
        working-directory: apps/ava-softphone-desktop
        run: node --test scripts/validate-release-assets.test.mjs scripts/release-channel.test.mjs scripts/azure-artifact-sign.test.mjs
      - name: Run the complete Lemtel Desktop test suite
        working-directory: apps/ava-softphone-desktop
        run: npm test
      - name: Typecheck the Desktop renderer
        working-directory: apps/ava-softphone-desktop
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build renderer and Electron main process
        working-directory: apps/ava-softphone-desktop
        run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - name: Test authenticated recording contract without live PBX
        run: deno test --no-check --allow-read --no-lock supabase/functions/fusionpbx-proxy/recordingAccess.contract.test.ts

  release-plan:
    name: Determine signed release platforms
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      windows_signed: ${{ steps.windows.outputs.signed }}
      windows_signing_mode: ${{ steps.windows.outputs.mode }}
    steps:
      - id: windows
        name: Check Windows signing availability without revealing secrets
        env:
          # Azure Artifact Signing: repository variables only (identifiers, no secret; GitHub OIDC signs in).
          AZ_TENANT: ${{ vars.LEMTEL_AZURE_TENANT_ID }}
          AZ_CLIENT: ${{ vars.LEMTEL_AZURE_CLIENT_ID }}
          AZ_SUBSCRIPTION: ${{ vars.LEMTEL_AZURE_SUBSCRIPTION_ID }}
          AZ_ENDPOINT: ${{ vars.LEMTEL_AZURE_SIGNING_ENDPOINT }}
          AZ_ACCOUNT: ${{ vars.LEMTEL_AZURE_SIGNING_ACCOUNT }}
          AZ_PROFILE: ${{ vars.LEMTEL_AZURE_SIGNING_PROFILE }}
        shell: bash
        run: |
          if [[ -n "$AZ_TENANT" && -n "$AZ_CLIENT" && -n "$AZ_SUBSCRIPTION" && -n "$AZ_ENDPOINT" && -n "$AZ_ACCOUNT" && -n "$AZ_PROFILE" ]]; then
            { echo 'signed=true'; echo 'mode=azure'; } >> "$GITHUB_OUTPUT"
            echo 'Windows signed build enabled: Azure Artifact Signing (GitHub OIDC).'
          else
            # Public CAs no longer issue exportable (.pfx) code-signing keys; Azure Artifact Signing is the only path.
            { echo 'signed=false'; echo 'mode=none'; } >> "$GITHUB_OUTPUT"
            echo 'Windows signed build disabled: Azure Artifact Signing variables are not set.'
          fi

  build-mac:
    name: Signed macOS x64 and arm64
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: macos-14
    environment: lemtel-hostinger-staging
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      VITE_LEMTEL_TARGET: ${{ vars.VITE_LEMTEL_TARGET }}
      # The desktop app reads the canonical Lemtel origin and key under its runtime names (src/lib/backendOrigin.ts).
      VITE_SUPABASE_URL: ${{ vars.VITE_LEMTEL_API_URL }}
      VITE_LEMTEL_PRIVATE_DIRECTORY: ${{ vars.VITE_LEMTEL_PRIVATE_DIRECTORY }}
      VITE_LEMTEL_EMAIL_ONLY_SIGNIN: approved
      VITE_LEMTEL_AUTH_REDIRECT_URL: ${{ vars.VITE_LEMTEL_AUTH_REDIRECT_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ava-softphone-desktop/package-lock.json
      - name: Enforce approved Lemtel Hostinger profile
        # The filter validates the canonical Lemtel profile under its Lemtel names and refuses generic runtime keys,
        # so it runs with exactly the values the build will embed (same origin, same publishable key).
        env:
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_PUBLISHABLE_KEY: ""
          VITE_LEMTEL_API_URL: ${{ vars.VITE_LEMTEL_API_URL }}
          VITE_LEMTEL_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_LEMTEL_HOSTED_ONBOARDING: approved
        run: node scripts/lemtel-hostinger-client-config-filter.mjs
      - name: Require macOS signing and notarization configuration
        shell: bash
        run: |
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!key}" ]]; then echo "Missing required signing secret: $key"; exit 1; fi
          done
      - name: Install and build
        working-directory: apps/ava-softphone-desktop
        run: npm ci --no-audit --no-fund && npm run build
      - name: Package signed and notarized builds
        working-directory: apps/ava-softphone-desktop
        run: npx electron-builder --mac --x64 --arm64 --publish never
      - name: Verify both packaged app signatures and Gatekeeper assessment
        shell: bash
        working-directory: apps/ava-softphone-desktop
        run: |
          set -euo pipefail
          COUNT=0
          for app in dist-electron/mac*/"Lemtel Telecom.app"; do
            test -d "$app" || continue
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --verbose=2 "$app"
            COUNT=$((COUNT + 1))
          done
          test "$COUNT" -eq 2 && test -f dist-electron/latest-mac.yml
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          if-no-files-found: error
          path: |
            apps/ava-softphone-desktop/dist-electron/*.dmg
            apps/ava-softphone-desktop/dist-electron/*.zip
            apps/ava-softphone-desktop/dist-electron/*.blockmap
            apps/ava-softphone-desktop/dist-electron/latest-mac.yml

  build-windows:
    name: Signed Windows NSIS x64
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, release-plan]
    runs-on: windows-2022
    environment: lemtel-hostinger-staging
    permissions:
      contents: read
      id-token: write   # GitHub OIDC -> Azure (federated credential on environment lemtel-hostinger-staging)
    env:
      WINDOWS_SIGNED: ${{ needs.release-plan.outputs.windows_signed }}
      WINDOWS_SIGNING_MODE: ${{ needs.release-plan.outputs.windows_signing_mode }}
      VITE_LEMTEL_TARGET: ${{ vars.VITE_LEMTEL_TARGET }}
      # The desktop app reads the canonical Lemtel origin and key under its runtime names (src/lib/backendOrigin.ts).
      VITE_SUPABASE_URL: ${{ vars.VITE_LEMTEL_API_URL }}
      VITE_LEMTEL_PRIVATE_DIRECTORY: ${{ vars.VITE_LEMTEL_PRIVATE_DIRECTORY }}
      VITE_LEMTEL_EMAIL_ONLY_SIGNIN: approved
      VITE_LEMTEL_AUTH_REDIRECT_URL: ${{ vars.VITE_LEMTEL_AUTH_REDIRECT_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ava-softphone-desktop/package-lock.json
      - name: Enforce approved Lemtel Hostinger profile
        # The filter validates the canonical Lemtel profile under its Lemtel names and refuses generic runtime keys,
        # so it runs with exactly the values the build will embed (same origin, same publishable key).
        env:
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_PUBLISHABLE_KEY: ""
          VITE_LEMTEL_API_URL: ${{ vars.VITE_LEMTEL_API_URL }}
          VITE_LEMTEL_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_LEMTEL_HOSTED_ONBOARDING: approved
        run: node scripts/lemtel-hostinger-client-config-filter.mjs
      - name: Sign in to Azure with GitHub OIDC (no secret)
        if: needs.release-plan.outputs.windows_signing_mode == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.LEMTEL_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.LEMTEL_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.LEMTEL_AZURE_SUBSCRIPTION_ID }}
      - name: Install the Azure Artifact Signing module (pinned)
        if: needs.release-plan.outputs.windows_signing_mode == 'azure'
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name TrustedSigning -RequiredVersion 0.4.1 -Repository PSGallery -Scope CurrentUser -Force
      - name: Install and build
        working-directory: apps/ava-softphone-desktop
        run: npm ci --no-audit --no-fund && npm run build
      - name: Package signed or explicitly unsigned Windows NSIS installer
        shell: pwsh
        working-directory: apps/ava-softphone-desktop
        env:
          LEMTEL_AZURE_SIGNING_ENDPOINT: ${{ vars.LEMTEL_AZURE_SIGNING_ENDPOINT }}
          LEMTEL_AZURE_SIGNING_ACCOUNT: ${{ vars.LEMTEL_AZURE_SIGNING_ACCOUNT }}
          LEMTEL_AZURE_SIGNING_PROFILE: ${{ vars.LEMTEL_AZURE_SIGNING_PROFILE }}
        run: |
          if ($env:WINDOWS_SIGNING_MODE -eq 'azure') {
            # scripts/azure-artifact-sign.cjs signs every binary (app, uninstaller, installer) before latest.yml is written.
            $env:LEMTEL_AZURE_SIGNING = 'true'
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
            npx electron-builder --win --x64 --publish never
          } else {
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
            npx electron-builder --win --x64 --publish never
          }
      - name: Verify installer and updater manifest
        shell: pwsh
        working-directory: apps/ava-softphone-desktop
        run: |
          $installers = @(Get-ChildItem dist-electron -Filter '*.exe')
          if ($installers.Count -ne 1 -or -not (Test-Path dist-electron/latest.yml)) { throw 'Installer or latest.yml missing' }
          $signature = Get-AuthenticodeSignature $installers[0].FullName
          if ($env:WINDOWS_SIGNED -eq 'true' -and $signature.Status -ne 'Valid') { throw "Invalid installer signature: $($signature.Status)" }
          if ($env:WINDOWS_SIGNED -eq 'true') {
            # Installed apps refuse an update whose signer differs from win.signtoolOptions.publisherName.
            # Same names as win.signtoolOptions.publisherName (case-insensitive, quoted or not).
            $expected = '(^|, )CN="?(Automatisation Assistant Virtuel IA Inc\.|Automation Assistant Virtual AI Inc\.?)"?(,|$)'
            if ($signature.SignerCertificate.Subject -notmatch $expected) { throw "Signer does not match publisherName: $($signature.SignerCertificate.Subject)" }
            if ($null -eq $signature.TimeStamperCertificate) { throw 'Installer signature is not timestamped' }
            Write-Host "Windows installer signed by: $($signature.SignerCertificate.Subject)"
          }
          if ($env:WINDOWS_SIGNED -ne 'true') { Write-Host "Windows installer intentionally unsigned; SmartScreen warning is expected." }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          if-no-files-found: error
          path: |
            apps/ava-softphone-desktop/dist-electron/*.exe
            apps/ava-softphone-desktop/dist-electron/*.blockmap
            apps/ava-softphone-desktop/dist-electron/latest.yml

  publish:
    name: Publish verified Desktop release
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.verify.result == 'success' &&
      needs.release-plan.result == 'success' &&
      needs.build-mac.result == 'success' &&
      needs.build-windows.result == 'success'
    needs: [verify, release-plan, build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WINDOWS_SIGNED: ${{ needs.release-plan.outputs.windows_signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - id: release-mode
        name: Declare only the verified release platforms
        shell: bash
        run: |
          echo 'mode=all' >> "$GITHUB_OUTPUT"
          if [[ "$WINDOWS_SIGNED" == 'true' ]]; then
            cat > release-notes.md <<'EOF'
          Lemtel Desktop — Windows x64 and macOS x64/arm64, signed and verified.
          EOF
          else
            cat > release-notes.md <<'EOF'
          Lemtel Desktop — macOS x64/arm64, signed and notarized by Apple; Windows x64 installer available.

          The Windows x64 installer is intentionally unsigned by the owner’s release policy and may trigger Microsoft SmartScreen. A valid Authenticode certificate will be added in a later release; no signature is claimed for this installer.
          EOF
          fi
          if [[ "$GITHUB_REF_NAME" == "v2.5.19" ]]; then
            cat >> release-notes.md <<'EOF'

          v2.5.19 opens the full Lemtel Desktop workspace after a verified session bootstrap, including Dark/Daylight, English/French and workspace navigation. When telephony is not provisioned, the call action remains disabled and Desktop does not start SIP, load call data, or use telephony credentials.
          EOF
          fi
          if [[ "$GITHUB_REF_NAME" == "v2.5.20" ]]; then
            cat >> release-notes.md <<'EOF'

          v2.5.20 makes every verified Desktop workspace page visible: Home, Phone, Calls, Chats, Contacts and Settings. It adds an organization-first Home aligned with the iOS and Android visual system plus safe Desktop preferences for theme, language, brightness, contrast and launch on startup.

          Calling, call history, conversations and organization contacts remain protected until an administrator provisions telephony. This release does not start SIP, load protected organization data, store telephony credentials or change server telephony configuration.
          EOF
          fi
      - name: Verify platform-specific artifacts, manifests and SHA-512 hashes
        shell: bash
        run: |
          VERSION="$(node -p 'require("./apps/ava-softphone-desktop/package.json").version')"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          node apps/ava-softphone-desktop/scripts/validate-release-assets.mjs \
            release-assets "$VERSION" "${{ steps.release-mode.outputs.mode }}"
      - name: Create a new release without deleting or replacing an existing one
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'This release already exists; refusing to replace its verified binaries'; exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --draft --verify-tag --title "Lemtel Telecom $GITHUB_REF_NAME" \
            --notes-file release-notes.md
          # A failed upload leaves only an unpublished draft, never a partial
          # auto-update release for installed clients to discover.
          diff -u \
            <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort) \
            <(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

  announce:
    name: Email every active Lemtel user about this release
    # Runs only after the release is public. The server decides everything (it reads the newest COMPLETE
    # release itself, emails each active user once, in their language); this job only rings the bell.
    if: always() && needs.publish.result == 'success'
    needs: [publish]
    runs-on: ubuntu-latest
    environment: lemtel-hostinger-staging
    permissions: {}
    env:
      LEMTEL_API_URL: ${{ vars.VITE_LEMTEL_API_URL }}
      LEMTEL_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Trigger the release announcement (idempotent, resumable)
        shell: bash
        run: |
          set -uo pipefail
          [[ "$LEMTEL_API_URL" =~ ^https://[a-z0-9.-]+$ ]] || { echo 'VITE_LEMTEL_API_URL is not an https origin'; exit 1; }
          want="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 30); do
            body="$(curl -sS --max-time 150 -X POST "$LEMTEL_API_URL/functions/v1/lemtel-release-announce" \
              -H "apikey: $LEMTEL_PUBLISHABLE_KEY" -H "Authorization: Bearer $LEMTEL_PUBLISHABLE_KEY" \
              -H 'Content-Type: application/json' -d '{}' || true)"
            status="$(node -e 'try{const b=JSON.parse(process.argv[1]);console.log(`${b.status||b.error||"unknown"} ${b.version||"-"}`)}catch{console.log("unreadable -")}' "$body")"
            echo "attempt $attempt: $status"
            case "$status" in
              "sent $want"|"already_announced $want") echo "Release v$want announced."; exit 0 ;;
              "partial $want") continue ;;
            esac
            sleep 30   # GitHub "latest" can lag a little behind the publish step
          done
          echo "The announcement did not complete; a platform administrator can resend it from the portal."
          exit 1

name: Voice localization checks

on:
  push:
    paths:
      - "src/lib/i18n/**"
      - "src/components/planipret/mobile/AvaVoiceAgent.tsx"
      - "src/components/planipret/mobile/VoiceSettingsSheet.tsx"
      - "src/components/planipret/admin/ava/**"
      - "apps/planipret-mobile/src/lib/i18n/**"
      - "apps/planipret-mobile/src/components/planipret/mobile/**"
      - ".github/workflows/voice-localization.yml"
  pull_request:
    paths:
      - "src/lib/i18n/**"
      - "src/components/planipret/mobile/AvaVoiceAgent.tsx"
      - "src/components/planipret/mobile/VoiceSettingsSheet.tsx"
      - "src/components/planipret/admin/ava/**"
      - "apps/planipret-mobile/src/lib/i18n/**"
      - "apps/planipret-mobile/src/components/planipret/mobile/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: TypeScript typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Voice localization tests
        run: npx vitest run src/lib/i18n
      - name: Production build
        run: npm run build

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// CI debug builds need no release key. Never store signing material in source
// or fall back to a developer's local keystore. A release requires all four.
def releaseKeystorePath = System.getenv('LEMTEL_ANDROID_KEYSTORE_FILE')?.trim()
def releaseStorePassword = System.getenv('LEMTEL_ANDROID_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('LEMTEL_ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('LEMTEL_ANDROID_KEY_PASSWORD')
def releaseSigningReady = [releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
    .every { it != null && !it.trim().isEmpty() } && file(releaseKeystorePath).isFile()

android {
    namespace "com.lemtel.softphone"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lemtel.softphone"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 113
        versionName "2.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Catch aggregate tasks such as `build` that transitively package a release.
// Fail before compiling rather than generating a misleading unsigned bundle.
gradle.taskGraph.whenReady { graph ->
    def releasePackaging = graph.allTasks.any { task ->
        task.project.path == project.path && task.name in ['assembleRelease', 'bundleRelease', 'packageRelease']
    }
    if (releasePackaging && !releaseSigningReady) {
        throw new GradleException('Lemtel release signing is not configured: provide LEMTEL_ANDROID_KEYSTORE_FILE, LEMTEL_ANDROID_STORE_PASSWORD, LEMTEL_ANDROID_KEY_ALIAS and LEMTEL_ANDROID_KEY_PASSWORD via a private channel.')
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

android.useAndroidX=true
kotlin.jvm.target.validation.mode=IGNORE
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
android.suppressUnsupportedCompileSdk=35
# org.gradle.java.home is intentionally NOT set here.
# On Linux CI: set JAVA_HOME=/home/ubuntu/jdk17 in the environment.
# On macOS: Gradle uses the system JDK (set via JAVA_HOME or /usr/libexec/java_home).

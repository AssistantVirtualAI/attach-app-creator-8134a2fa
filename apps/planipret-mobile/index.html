<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1A4A8A" />
    <title>Planiprêt Mobile</title>
    <meta name="description" content="Planiprêt — application mobile courtier (appels, messages, pipeline, AVA)." />
    <!-- Warm up the asset host early so logos + preloaded chunks resolve fast on cold start. -->
    <link rel="preconnect" href="https://avastatistic.ca" crossorigin />
    <link rel="dns-prefetch" href="https://avastatistic.ca" />
    <link rel="preconnect" href="https://gejxisrqtvxavbrfcoxz.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://gejxisrqtvxavbrfcoxz.supabase.co" />
    <!-- Preload the LCP logo used in the header. -->
    <link rel="preload" as="image" href="https://avastatistic.ca/__l5e/assets-v1/e3dd3a86-14ac-4585-8736-b102e9737302/planipret-logo.png" fetchpriority="high" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { background: #0A1425; height: 100%; overflow: hidden; -webkit-text-size-adjust: 100%; touch-action: manipulation; }
      body { background: #0A1425; height: 100%; min-height: -webkit-fill-available; overflow: hidden; overscroll-behavior: none; }
      #root { background: #0A1425; height: 100%; min-height: -webkit-fill-available; overflow: hidden; }
      input, textarea, select { font-size: 16px !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        // Boot-time error tracer: surfaces any JS exception thrown before
        // bootstrap:start (WKWebView only reports "A JavaScript exception occurred").
        window.addEventListener('error', function (e) {
          try {
            console.error('[PP] boot-error', JSON.stringify({
              message: String(e.message || ''),
              source: String(e.filename || ''),
              line: e.lineno || 0,
              col: e.colno || 0,
              stack: e.error && e.error.stack ? String(e.error.stack).slice(0, 600) : ''
            }));
          } catch (_) {}
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          try {
            var r = e.reason;
            console.error('[PP] boot-rejection', String((r && (r.stack || r.message)) || r || ''));
          } catch (_) {}
        }, true);
      })();

      (function () {
        function isIgnorableNativeStartupError(raw) {
          if (typeof raw === 'string') return /multi_header\.length|multi_header/i.test(raw);
          if (!raw || typeof raw !== 'object') return false;
          var message = String(raw.message || raw.errorMessage || '').trim();
          var code = String(raw.code || '').trim();
          if (/multi_header\.length|multi_header/i.test(message)) return true;
          if (!message && !code && Object.keys(raw).length === 0) return true;
          return code === 'UNIMPLEMENTED' && /not implemented/i.test(message);
        }
        window.__PP_REACT_BOOTED__ = false;
        window.__PP_REACT_BOOT_ATTEMPTED__ = false;
        window.__PP_DISABLE_NATIVE_BOOT_FALLBACK__ = true;
        window.addEventListener('error', function (event) {
          if (!isIgnorableNativeStartupError(event.error) && !isIgnorableNativeStartupError(event.message)) return;
          event.preventDefault();
          event.stopImmediatePropagation();
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          if (!isIgnorableNativeStartupError(event.reason)) return;
          event.preventDefault();
          event.stopImmediatePropagation();
        }, true);
      })();

      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.innerHTML === '' && !window.__PP_REACT_BOOTED__) {
          root.innerHTML = '<div data-pp-boot-visible="1" style="color:white;padding:20px;background:#0A1425;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif">Démarrage...</div>';
        }
      }, 1200);

      // Filet de sécurité : si React n'a jamais démarré (rechargement du WebView
      // sur une route profonde comme /auth/maestro/callback), on repart de la
      // racine une seule fois au lieu de rester sur « Démarrage… ».
      setTimeout(function () {
        if (window.__PP_REACT_BOOTED__) return;
        var deep = location.pathname && location.pathname !== '/' && location.pathname !== '/index.html';
        if (!deep) return;
        try {
          if (sessionStorage.getItem('pp_boot_recovered') === '1') return;
          sessionStorage.setItem('pp_boot_recovered', '1');
          if (location.pathname.indexOf('/auth/') === 0) {
            sessionStorage.setItem('pp_boot_recovered_search', location.search || '');
          }
        } catch (_) {}
        location.replace('/');
      }, 6000);
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>

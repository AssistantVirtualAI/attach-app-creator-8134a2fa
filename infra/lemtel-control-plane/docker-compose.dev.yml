name: lemtel-control-plane-dev

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

x-after-guard: &after-guard
  config-guard: { condition: service_completed_successfully }

services:
  config-guard:
    image: busybox:1.37.0-musl
    user: "65534:65534"
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    network_mode: none
    entrypoint: ["/bin/sh", "/guard/config-guard.sh"]
    environment:
      CONTROL_PLANE_SERVICE_TOKEN: ${CONTROL_PLANE_SERVICE_TOKEN:-}
      CONTROL_PLANE_DB_PASSWORD: ${CONTROL_PLANE_DB_PASSWORD:-}
      CONTROL_PLANE_REDIS_PASSWORD: ${CONTROL_PLANE_REDIS_PASSWORD:-}
    configs:
      - source: guard
        target: /guard/config-guard.sh

  control-plane:
    <<: *hardening
    build:
      context: ../../services/lemtel-control-plane
    environment:
      NODE_ENV: development
      CONTROL_PLANE_PORT: "8080"
      CONTROL_PLANE_DATABASE_URL: postgres://cp_app:${CONTROL_PLANE_DB_PASSWORD:-}@postgres:5432/control_plane
      CONTROL_PLANE_REDIS_URL: redis://:${CONTROL_PLANE_REDIS_PASSWORD:-}@redis:6379
      CONTROL_PLANE_SERVICE_TOKEN: ${CONTROL_PLANE_SERVICE_TOKEN:-}
      CONTROL_PLANE_LOG_LEVEL: ${CONTROL_PLANE_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8081:8080"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    depends_on:
      <<: *after-guard
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  postgres:
    <<: *hardening
    image: postgres:16.10-alpine3.22
    environment:
      POSTGRES_DB: control_plane
      POSTGRES_USER: cp_app
      POSTGRES_PASSWORD: ${CONTROL_PLANE_DB_PASSWORD:-}
    volumes:
      - cp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cp_app -d control_plane"]
      interval: 5s
      retries: 10
    depends_on:
      <<: *after-guard

  redis:
    <<: *hardening
    image: redis:7.4.6-alpine3.21
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${CONTROL_PLANE_REDIS_PASSWORD:-}
    depends_on:
      <<: *after-guard

configs:
  guard:
    file: ./config-guard.sh

volumes:
  cp_pgdata:

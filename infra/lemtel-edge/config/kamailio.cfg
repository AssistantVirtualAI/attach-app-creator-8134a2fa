#!KAMAILIO
# Lemtel Edge - Kamailio signalling template (Phase 2).
# INERT TEMPLATE: not started, not tested, not referenced by any script or container in Phase 2.
# Selected stack: Kamailio (signalling only) + RTPengine (media only).
# Future production policy: SIP TLS / WSS with TLS 1.2 or newer, SRTP or DTLS-SRTP media.
# Default deny: every request receives a static 503. Nothing is registered, authenticated,
# proxied, relayed or forwarded, and no event or HTTP call is emitted.

import_file "kamailio-local.cfg"

####### Global parameters #######
debug=2
log_stderror=no
fork=yes
children=2
auto_aliases=no
dns=no
rev_dns=no
dns_try_ipv6=no
use_dns_cache=no

# No public interface. The only listener is a loopback placeholder, disabled by default.
#!ifdef LEMTEL_EDGE_LOCAL_VALIDATION
listen=udp:127.0.0.1:5060
#!endif

####### Modules #######
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sanity.so"
loadmodule "textops.so"
loadmodule "pv.so"
loadmodule "xlog.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"
loadmodule "tls.so"
loadmodule "nathelper.so"
loadmodule "outbound.so"
loadmodule "path.so"
loadmodule "rtpengine.so"
loadmodule "ctl.so"

####### Module parameters #######
# WebSocket CORS disabled. Future origins must be listed explicitly, never a wildcard.
modparam("websocket", "cors_mode", 0)
# Future internal-only RTPengine NG control. Never called in Phase 2.
modparam("rtpengine", "rtpengine_sock", "udp:rtpengine:2223")
# Local control socket only.
modparam("ctl", "binrpc", "unix:/run/kamailio/kamailio_ctl")
# TLS profile: see kamailio-tls.cfg.example (NOT ENABLED IN PHASE 2).

####### Routing logic #######
request_route {
	sl_send_reply("503", "Lemtel Edge disabled");
	exit;
}

event_route[xhttp:request] {
	xhttp_reply("503", "Service Unavailable", "text/plain", "Lemtel Edge disabled");
	exit;
}

####### FUTURE DESIGN REFERENCE - NON-EXECUTABLE, COMMENTS ONLY #######
# A future, separately approved phase may add a WSS handshake. Required checks, in order:
#   1. method is GET
#   2. Upgrade header equals websocket
#   3. Connection header contains Upgrade
#   4. Host is in the allowed host list
#   5. Origin is in the explicit allowed Origin list (no wildcard, no CORS allow-all)
#   6. only then call ws_handle_handshake()
# Future routing (Outbound/Path or nathelper for WebSocket clients), rtpengine_manage(),
# t_relay() towards an allowlisted private FusionPBX trunk and signed Control Plane events
# are NOT part of this template and require a separately approved phase.

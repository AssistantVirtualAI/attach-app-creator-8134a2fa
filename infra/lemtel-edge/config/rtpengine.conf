# Lemtel Edge - RTPengine media relay template (Phase 2).
# NOT STARTED OR TESTED IN PHASE 2. Inert template, not referenced by any script or container.
# Media only. No recording, transcoding, forking, Redis, HTTP/WebSocket API, CLI listener,
# graphite, external interface, public advertised address or credential.

[rtpengine]
interface = 127.0.0.1
listen-ng = 127.0.0.1:2223
port-min = 30000
port-max = 30010
timeout = 60
silent-timeout = 3600
final-timeout = 0
foreground = true
log-stderr = true
log-level = 6

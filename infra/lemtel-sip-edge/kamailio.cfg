#!KAMAILIO
# Lemtel SIP edge — push gateway between the Lemtel apps and FusionPBX (template; see README.md).
# Holds an INVITE for a sleeping app, asks lemtel-push-notify to wake it, and forks the INVITE to the new contact.
#!substdef "!UPSTREAM!$env(LEMTEL_UPSTREAM_PBX)!g"
#!substdef "!HOOKURL!$env(LEMTEL_PUSH_HOOK_URL)!g"

listen=tls:0.0.0.0:5061
listen=tcp:127.0.0.1:5060
enable_tls=yes
tcp_accept_no_cl=yes

loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "path.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "nathelper.so"
loadmodule "tls.so"
loadmodule "tsilo.so"
loadmodule "http_async_client.so"
loadmodule "crypto.so"
loadmodule "jansson.so"

modparam("tls", "config", "/etc/kamailio/tls.cfg")
modparam("usrloc", "db_mode", 0)
modparam("registrar", "max_expires", 3600)
modparam("rr", "append_fromtag", 1)
modparam("http_async_client", "workers", 2)
modparam("http_async_client", "connection_timeout", 3000)

request_route {
	route(SANITY);
	if (is_method("CANCEL")) { if (t_check_trans()) t_relay(); exit; }
	if (has_totag()) { if (loose_route()) { t_relay(); } else { sl_send_reply("404", "Not here"); } exit; }
	record_route();
	if (is_method("REGISTER")) { route(REGISTER); exit; }
	if (is_method("INVITE") && src_ip != myself && $si == "UPSTREAM") { route(TO_APP); exit; }
	# Everything from an app goes to FusionPBX (authentication stays FusionPBX's job).
	$du = "sip:UPSTREAM;transport=tls";
	t_relay();
}

route[SANITY] {
	if (!mf_process_maxfwd_header("10")) { sl_send_reply("483", "Too Many Hops"); exit; }
	if (!sanity_check("17895", "7")) exit;
}

# REGISTER from an app: relayed to FusionPBX with Path; on 200 OK the binding is also kept here so a held INVITE can be
# appended to it (tsilo). Push contacts (RFC 8599 pn-* parameters) are what lemtel-push-notify wakes.
route[REGISTER] {
	add_path_received();
	$du = "sip:UPSTREAM;transport=tls";
	t_on_reply("REGISTER_REPLY");
	t_relay();
}
onreply_route[REGISTER_REPLY] {
	if (t_check_status("200")) {
		save("location", "0x04");
		ts_append("location", "$tu");     # a pending INVITE for this user now reaches the fresh contact
	}
}

# INVITE from FusionPBX for an app user: hold it, wake the devices, relay to whatever is registered now.
route[TO_APP] {
	if (!t_newtran()) { sl_reply_error(); exit; }
	ts_store();
	route(PUSH);
	if (lookup("location")) { t_relay(); exit; }
	# No live contact: keep the transaction open while the woken app registers (ts_append above).
	t_set_fr(30000, 5000);
	send_reply("100", "Waking device");
}

route[PUSH] {
	$var(ts) = $Ts;
	$var(nonce) = $(ci{s.md5});
	jansson_set("string", "sipDomain", "$rd", "$var(body)");
	jansson_set("string", "extension", "$rU", "$var(body)");
	jansson_set("string", "callRef", "$(ci{s.md5})", "$var(body)");
	jansson_set("string", "fromNumber", "$fU", "$var(body)");
	jansson_set("string", "fromName", "$fn", "$var(body)");
	crypto_hmac_sha256("$var(ts).$var(nonce).$var(body)", "$env(LEMTEL_PUSH_HOOK_SECRET)", "$var(sig)");
	$http_req(all) = $null;
	$http_req(method) = "POST";
	$http_req(timeout) = 3000;
	$http_req(hdr) = "Content-Type: application/json";
	$http_req(hdr) = "X-Lemtel-Timestamp: " + $var(ts);
	$http_req(hdr) = "X-Lemtel-Nonce: " + $var(nonce);
	$http_req(hdr) = "X-Lemtel-Signature: " + $(var(sig){s.tolower});
	$http_req(body) = $var(body);
	http_async_query("HOOKURL", "PUSH_REPLY");
}
route[PUSH_REPLY] {
	xlog("L_INFO", "lemtel-push-notify status=$http_rs\n");
}

# Lemtel TURN relay — installed by lemtel-turn-install.sh into /opt/lemtel-turn on the DO writer.
services:
  turn:
    image: coturn/coturn:4.6.3
    container_name: lemtel-turn
    restart: unless-stopped
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - /etc/lemtel-turn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

# Lemtel coturn (template). Secret and certificates are mounted at runtime, never committed.
listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200
fingerprint
use-auth-secret
static-auth-secret-file=/run/secrets/lemtel_turn_secret
realm=turn.assistantvirtualai.com
cert=/etc/coturn/tls/fullchain.pem
pkey=/etc/coturn/tls/privkey.pem
no-cli
no-multicast-peers
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
total-quota=200
stale-nonce=600
no-tlsv1
no-tlsv1_1
log-file=stdout

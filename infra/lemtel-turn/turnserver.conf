# Lemtel coturn (decision D2: Lemtel hosts the media relay; nothing to install on FusionPBX).
# TEMPLATE: lemtel-turn-install.sh fills the PUBLIC_IP and SHARED_SECRET placeholders on the DO writer into
# /etc/lemtel-turn/turnserver.conf (root:nogroup 0640). The secret is never committed, printed or logged.
listening-ip=@PUBLIC_IP@
relay-ip=@PUBLIC_IP@
listening-port=3478
min-port=49160
max-port=49200
fingerprint
# TURN REST API (coturn use-auth-secret): apps receive a 1-hour HMAC credential from lemtel-softphone-provisioning.
use-auth-secret
static-auth-secret=@SHARED_SECRET@
realm=lemtel.assistantvirtualai.com
# Media relay only: UDP relays, no TLS/DTLS listeners (port 443/5349 stay free), no admin CLI.
no-tcp-relay
no-tls
no-dtls
no-cli
no-multicast-peers
no-loopback-peers
# Never relay into private, loopback, link-local, CGNAT or Lemtel's own servers.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=@PUBLIC_IP@
denied-peer-ip=72.60.125.253
user-quota=12
total-quota=200
stale-nonce=600
log-file=stdout
simple-log
